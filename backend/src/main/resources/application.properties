spring.application.name=filesharing-backend

# PostgreSQL. Use a JDBC URL or a Neon postgresql:// URL.
# SPRING_DATASOURCE_URL or DATABASE_URL, plus DB_USER and DB_PASSWORD when they are not in the URL.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/filesharing_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
file.upload-dir=${user.dir}/uploads

# JWT
app.jwt-secret=${JWT_SECRET:local-development-jwt-secret-must-be-32-characters-or-more}
app.jwt-expiration-milliseconds=86400000

# Logging
logging.level.root=INFO
logging.level.com.filesharing.backend=INFO
logging.level.org.springframework.web=INFO

# File Upload - 25MB max
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Static resource handling
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/uploads/**
spring.web.resources.static-locations=file:${file.upload-dir}/

# CORS settings
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Content-Disposition,Content-Type,Content-Length,X-Frame-Options
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Security settings
spring.security.filter.http.disable-security=true

# Email. Leave blank locally if you are not sending mail.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME:}
